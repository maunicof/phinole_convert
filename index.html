<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Foto Estenopeica → Positivo</title>
<style>
  :root{
    --bg:#111318; --card:#1c2027; --accent:#f5b841; --text:#e8eaed; --muted:#9aa3af;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .app{max-width:520px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px;}
  header{text-align:center;padding-top:8px;}
  h1{font-size:1.25rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.85rem;margin:0;}

  .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.35);}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:14px;border:none;border-radius:12px;
    font-size:1rem;font-weight:600;cursor:pointer;transition:transform .05s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#16130a;}
  .btn-secondary{background:#2b313a;color:var(--text);}
  .btn-ghost{background:transparent;border:1px solid #3a414c;color:var(--text);}

  input[type=file]{display:none;}

  .preview-wrap{position:relative;width:100%;border-radius:12px;overflow:hidden;
    background:#000;min-height:160px;display:flex;align-items:center;justify-content:center;}
  .preview-wrap canvas{width:100%;height:auto;display:block;}
  .placeholder{color:var(--muted);font-size:.9rem;padding:32px 12px;text-align:center;}

  .controls{display:none;flex-direction:column;gap:12px;}
  .controls.visible{display:flex;}
  .slider-row{display:grid;grid-template-columns:88px 1fr 52px;align-items:center;gap:10px;font-size:.9rem;}
  .slider-row output{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;}
  input[type=range]{width:100%;accent-color:var(--accent);height:26px;}

  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hint{color:var(--muted);font-size:.78rem;text-align:center;margin:0;}
  .badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);
    color:#fff;font-size:.7rem;padding:3px 8px;border-radius:20px;letter-spacing:.05em;}
</style>
<base target="_blank">
</head>
<body>
<div class="app">
  <header>
    <h1>📷 Estenopeica → Positivo</h1>
    <p class="sub">Saca una foto a tu negativo o súbelo, y conviértelo a blanco y negro.</p>
  </header>

  <div class="card">
    <div class="preview-wrap">
      <span class="placeholder">La vista previa aparecerá aquí</span>
    </div>
  </div>

  <div class="card" style="display:flex;flex-direction:column;gap:10px;">
    <label class="btn btn-primary">
      📸 Usar cámara
      <input id="fileCamera" type="file" accept="image/*" capture="environment">
    </label>
    <label class="btn btn-secondary">
      🖼️ Subir de la galería
      <input id="fileGallery" type="file" accept="image/*">
    </label>
  </div>

  <div class="card controls" id="controls">
    <div class="slider-row">
      <label for="contrast">Contraste</label>
      <input type="range" id="contrast" min="50" max="200" value="120">
      <output id="contrastVal">120</output>
    </div>
    <div class="slider-row">
      <label for="brightness">Luces</label>
      <input type="range" id="brightness" min="50" max="200" value="100">
      <output id="brightnessVal">100</output>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnReset">↺ Reiniciar</button>
      <button class="btn btn-primary" id="btnDownload">⬇️ Guardar</button>
    </div>
    <p class="hint">Consejo: en iPhone usa «Guardar imagen» manteniendo presionada la foto descargada.</p>
  </div>

  <p class="hint">Todo se procesa en tu teléfono. Nada se sube a internet. ☁️❌</p>
</div>

<script>
(function(){
  const fileCamera = document.getElementById('fileCamera');
  const fileGallery = document.getElementById('fileGallery');
  const wrap = document.querySelector('.preview-wrap');
  const controls = document.getElementById('controls');
  const contrast = document.getElementById('contrast');
  const brightness = document.getElementById('brightness');
  const contrastVal = document.getElementById('contrastVal');
  const brightnessVal = document.getElementById('brightnessVal');
  const btnReset = document.getElementById('btnReset');
  const btnDownload = document.getElementById('btnDownload');

  let img = null;           // imagen original cargada
  let canvas = null, ctx = null;
  const MAX_SIDE = 2000;    // límite para que sea rápido en celulares

  function handleFile(e){
    const f = e.target.files[0];
    if(!f) return;
    const url = URL.createObjectURL(f);
    img = new Image();
    img.onload = () => {
      // escalar si es muy grande
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, MAX_SIDE / Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      wrap.innerHTML = '';
      wrap.appendChild(canvas);
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.id = 'badge';
      wrap.appendChild(badge);
      controls.classList.add('visible');
      apply();
      URL.revokeObjectURL(url);
    };
    img.src = url;
    e.target.value = ''; // permite re-elegir la misma foto
  }

  // Invertir negativo -> positivo, pasar a B/N y aplicar contraste/brillo.
  // Fórmula: out = (255 - gray - 128) * contrast/100 + 128 + (brightness-100)*1.28
  function apply(){
    if(!canvas) return;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const px = data.data;
    const c = contrast.value / 100;
    const b = (brightness.value - 100) * 1.28; // ±128 aprox
    for(let i = 0; i < px.length; i += 4){
      const gray = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2];
      let v = (255 - gray - 128) * c + 128 + b;
      v = v < 0 ? 0 : (v > 255 ? 255 : v);
      px[i] = px[i+1] = px[i+2] = v;
    }
    ctx.putImageData(data, 0, 0);
    contrastVal.textContent = contrast.value;
    brightnessVal.textContent = brightness.value;
    const badge = document.getElementById('badge');
    if(badge) badge.textContent = canvas.width + '×' + canvas.height;
  }

  function download(){
    if(!canvas) return;
    const a = document.createElement('a');
    a.download = 'positivo_' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  fileCamera.addEventListener('change', handleFile);
  fileGallery.addEventListener('change', handleFile);
  contrast.addEventListener('input', apply);
  brightness.addEventListener('input', apply);
  btnReset.addEventListener('click', () => {
    contrast.value = 120; brightness.value = 100; apply();
  });
  btnDownload.addEventListener('click', download);
})();
</script>
</body>
</html>
